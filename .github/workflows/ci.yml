name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: namespace-profile-bmc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt-clean check failed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test battery
        run: go test ./... -count=1

      - name: Check the org CI App pair is shared with this repo
        id: cred
        # The `secrets` context is not allowed in a step's `if:`, so the
        # presence check runs here and gates the mint step below.
        env:
          CI_APP_ID: ${{ secrets.CI_APP_ID }}
          CI_APP_SECRET: ${{ secrets.CI_APP_SECRET }}
        run: |
          if [ -z "$CI_APP_ID" ] || [ -z "$CI_APP_SECRET" ]; then
            echo "have-pair=false" >> "$GITHUB_OUTPUT"
            echo "::notice::org secrets CI_APP_ID/CI_APP_SECRET are not shared with this repo; the both-import pin step below will fail loudly until an org owner shares them and the app installation covers agent and runner-man"
          else
            echo "have-pair=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a cross-repo read token (the org CI App)
        id: crossrepo-token
        # The sanctioned cross-repo credential is the org-level CI App pair
        # (CI_APP_ID / CI_APP_SECRET) — the same org secret pair the xfer
        # green-tag publisher mints from. It must be shared with THIS repo
        # (org secret "selected repositories") and the app installation
        # must cover agent and runner-man. The minted token is scoped to
        # those two repos, contents:read only, and revoked when the job
        # ends. When the pair is not shared here the step is skipped and
        # the pin check below fails loudly — the check never silently
        # passes because it could not look.
        if: steps.cred.outputs.have-pair == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: 'agent,runner-man'
          permission-contents: read

      - name: Cross-repo both-import pin (the release gate's CI form)
        # The agent (bare-metal-cloud/agent) and the daemon
        # (bare-metal-cloud/runner-man) are PRIVATE, so this step needs a
        # token that can read them: the org CI App installation token
        # minted above. Without one (org secrets not shared with this
        # repo) the script FAILS loudly — the pin check never silently
        # passes because it could not look. The local form
        # (scripts/check-both-import-pin.sh with --agent-root /
        # --daemon-root, or an authenticated gh) is the runnable
        # backstop.
        env:
          GH_TOKEN: ${{ steps.crossrepo-token.outputs.token || github.token }}
        run: scripts/check-both-import-pin.sh

      - name: Refuse private imports
        run: |
          offenders=$(go list -deps ./... | grep -E '^github\.com/bare-metal-cloud/' | grep -vE '^github\.com/bare-metal-cloud/runner-contracts(/|$)' || true)
          if [ -n "$offenders" ]; then
            echo "::error::the module imports a private bare-metal-cloud module; it must stay public-safe (stdlib only):"
            echo "$offenders"
            exit 1
          fi

      - name: License scan (zero third-party dependencies)
        run: |
          mods=$(go list -m all | tail -n +2)
          if [ -n "$mods" ]; then
            echo "::error::unexpected module dependencies; the module must stay stdlib-only, and any dependency needs a license review before it may land:"
            echo "$mods"
            exit 1
          fi
